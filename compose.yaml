services:
  app:
    image: '${APP_IMAGE:-youth-benefit-backend:local}'
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DOCKER_COMPOSE_ENABLED: 'false'
      DB_URL: 'jdbc:postgresql://postgres:5432/${POSTGRES_DB:-youthbenefit}'
      DB_USERNAME: '${POSTGRES_USER:-youthbenefit}'
      DB_PASSWORD: '${POSTGRES_PASSWORD:-youthbenefit}'
      ONTONG_API_KEY: '${ONTONG_API_KEY:-}'
      ONTONG_SYNC_SCHEDULED: '${ONTONG_SYNC_SCHEDULED:-false}'
      HARVESTER_BASE_URL: '${HARVESTER_BASE_URL:-}'
      HARVESTER_API_KEY: '${HARVESTER_API_KEY:-}'
      HARVESTER_SYNC_SCHEDULED: '${HARVESTER_SYNC_SCHEDULED:-false}'
      ADMIN_API_KEY: '${ADMIN_API_KEY:-}'
      APP_WEB_URL: '${APP_WEB_URL:-http://localhost:5173}'
      CORS_ALLOWED_ORIGINS: '${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}'
      JWT_SECRET: '${JWT_SECRET:-}'
      KAKAO_CLIENT_ID: '${KAKAO_CLIENT_ID:-}'
      KAKAO_CLIENT_SECRET: '${KAKAO_CLIENT_SECRET:-}'
      KAKAO_REDIRECT_URIS: '${KAKAO_REDIRECT_URIS:-http://localhost:5173/auth/kakao/callback}'
      MAIL_USERNAME: '${MAIL_USERNAME:-}'
      MAIL_PASSWORD: '${MAIL_PASSWORD:-}'
      PWC_LLM_BASE_URL: '${PWC_LLM_BASE_URL:-}'
      PWC_LLM_API_KEY: '${PWC_LLM_API_KEY:-}'
      PWC_LLM_MODEL: '${PWC_LLM_MODEL:-openai.gpt-4.1-mini}'
      PWC_LLM_DAILY_TOKEN_LIMIT: '${PWC_LLM_DAILY_TOKEN_LIMIT:-3000000}'
    ports:
      - '${APP_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      org.springframework.boot.ignore: true
    restart: unless-stopped

  postgres:
    image: 'postgres:17'
    environment:
      POSTGRES_DB: '${POSTGRES_DB:-youthbenefit}'
      POSTGRES_USER: '${POSTGRES_USER:-youthbenefit}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-youthbenefit}'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
