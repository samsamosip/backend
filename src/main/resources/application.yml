spring:
  application:
    name: youth-benefit-backend
  config:
    # 프로젝트 루트의 .env 파일을 설정값으로 읽는다 (없어도 실행됨)
    import: optional:file:.env[.properties]
  docker:
    compose:
      enabled: ${DOCKER_COMPOSE_ENABLED:true}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/youthbenefit}
    username: ${DB_USERNAME:youthbenefit}
    password: ${DB_PASSWORD:youthbenefit}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 테이블은 Flyway(db/migration)로만 만든다

springdoc:
  swagger-ui:
    path: /docs              # API 문서 화면: http://localhost:8080/docs
    operations-sorter: method
  api-docs:
    path: /openapi.json

app:
  auth:
    # 로그인 토큰 서명 키(32자 이상 아무 문자열). 비어 있으면 실행할 때마다 새로 만들어져 서버 재시작 시 모두 로그아웃된다
    jwt-secret: ${JWT_SECRET:}
    access-token-minutes: 30   # 출입증(accessToken)
    refresh-token-days: 14     # 갱신 토큰 — 2주 동안 안 쓰면 다시 로그인
    kakao:
      # 카카오 디벨로퍼스 → 내 애플리케이션 → REST API 키 / 보안 → Client Secret
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      # 프론트 콜백 주소. 카카오 콘솔의 Redirect URI 와 같아야 한다 (콤마로 구분)
      redirect-uris: ${KAKAO_REDIRECT_URIS:http://localhost:5173/auth/kakao/callback}
    mail:
      # 인증 코드 메일. MAIL_USERNAME 이 비어 있으면 메일 대신 서버 로그에 코드를 찍는다(개발용)
      host: ${MAIL_HOST:smtp.gmail.com}
      port: ${MAIL_PORT:587}
      username: ${MAIL_USERNAME:}
      password: ${MAIL_PASSWORD:}   # Gmail 은 앱 비밀번호
      from-name: 청년혜택 길잡이
  admin:
    # 관리자 API(/api/v1/admin/**) 키. 비어 있으면 잠그지 않는다(로컬 개발). 배포 서버에만 넣는다
    api-key: ${ADMIN_API_KEY:}
  cors:
    # 프론트 개발 서버 주소. 배포하면 프론트 주소를 추가한다 (콤마로 구분)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

ontong:
  base-url: https://www.youthcenter.go.kr
  api-key: ${ONTONG_API_KEY:}
  page-size: 500           # 실측: 500건까지 한 번에 받아짐 → 약 7번 요청으로 전체 수집
  sync:
    scheduled: ${ONTONG_SYNC_SCHEDULED:false}
    cron: "0 0 */6 * * *"  # 6시간마다

notifications:
  daily:
    # 새 맞춤 공고·마감 임박 알림 (앱 안 알림함). 끄려면 NOTIFICATIONS_DAILY=false
    enabled: ${NOTIFICATIONS_DAILY:true}
    cron: "0 0 8 * * *"     # 매일 아침 8시

llm:
  # PwC LLM 게이트웨이 (글 조건 AI 변환, 자연어 검색). 주간 사용 한도가 걸려 있다. 값은 .env 에만
  base-url: ${PWC_LLM_BASE_URL:}
  api-key: ${PWC_LLM_API_KEY:}
  model: ${PWC_LLM_MODEL:openai.gpt-4.1-mini}          # 1차 변환 (싸고 빠름)
  review-model: ${PWC_LLM_REVIEW_MODEL:openai.gpt-4.1} # 애매한 것만 2차 확인
  timeout-seconds: 90

harvester:
  # 학교 장학 수집기(policy-harvester, sanvit). 키는 Harvester 관리자 화면에서 발급(90일 만료)
  base-url: ${HARVESTER_BASE_URL:}
  api-key: ${HARVESTER_API_KEY:}
  sync:
    scheduled: ${HARVESTER_SYNC_SCHEDULED:false}
    cron: "0 0 4 * * *"    # 매일 새벽 4시
